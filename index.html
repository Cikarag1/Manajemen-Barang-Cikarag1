<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dapur Cikarag 1</title>
  
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #1e3a5f;
            --muted: #647b94;
            --border: #dbeafe;
        }
        * { box-sizing: border-box; }
        body {
            max-width: 780px;
            margin: 0 auto;
            padding: 48px 22px;
            background: linear-gradient(145deg, #ffffff, #eff6ff 55%, #eaf4ff);
            color: var(--text);
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        h2 { margin: 0 0 28px; text-align: center; font-size: clamp(25px, 5vw, 34px); letter-spacing: -1px; }
        .card {
            margin-bottom: 20px;
            padding: 24px;
            background: #fff;
            border: 1px solid rgba(219, 234, 254, .9);
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(30, 41, 59, .07);
        }
        #formTitle { margin: 0 0 18px; font-size: 18px; }
        .form-group, .controls { display: flex; gap: 12px; }
        .form-group { margin: 0; }
        input, select {
            min-width: 0;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, .14); }
        input[type="text"], input[type="number"] { flex: 1; }
        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s, background .2s, box-shadow .2s;
        }
        button:hover { background: var(--primary-hover); box-shadow: 0 5px 12px rgba(59, 130, 246, .2); }
        button:active { transform: translateY(1px); }
        .controls { margin-bottom: 18px; }
        .search-box { flex: 2; }
        .sort-box { flex: 1; }
        .product-list { margin: 0; padding: 0; list-style: none; }
        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
            padding: 17px 20px;
            border: 1px solid #dbeafe;
            border-left: 4px solid var(--primary);
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 12px rgba(30, 41, 59, .04);
            transition: transform .2s, box-shadow .2s;
        }
        .product-item:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30, 41, 59, .08); }
        .product-info { display: flex; flex-direction: column; gap: 6px; }
        .product-name { font-weight: 600; font-size: 16px; }
        .product-price { color: #059669; font-weight: 700; font-size: 14px; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-edit, .btn-delete { padding: 9px 13px; font-size: 13px; }
        .btn-edit { background: #f59e0b; }
        .btn-edit:hover { background: #d97706; }
        .btn-delete { background: #ef4444; }
        .btn-delete:hover { background: #dc2626; }
        .no-result { padding: 28px 20px; border: 1px dashed #cbd5e1; border-radius: 12px; color: var(--muted); text-align: center; }
        @media (max-width: 600px) {
            body { padding: 30px 16px; }
            .card { padding: 18px; }
            .form-group, .controls { flex-direction: column; }
            .form-group button { width: 100%; }
            .product-item { align-items: flex-start; padding: 15px; }
            .action-buttons { flex-shrink: 0; }
            .btn-edit, .btn-delete { padding: 8px 10px; }
        }
        /* Polesan visual dengan animasi ringan dan fokus aksesibel */
        body { min-height: 100vh; }
        h2 { margin-bottom: 8px; }
        h2::after {
            content: "Kelola daftar dan harga barang dengan mudah";
            display: block;
            margin-top: 10px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0;
        }
        .card { margin-top: 28px; transition: box-shadow .2s, transform .2s; }
        .card:hover { box-shadow: 0 16px 38px rgba(30, 41, 59, .1); }
        input::placeholder { color: #94a3b8; }
        input:focus, select:focus { transform: translateY(-1px); }
        button:focus-visible { outline: 3px solid rgba(79, 70, 229, .28); outline-offset: 3px; }
        .controls { margin-top: 26px; }
        .search-box, .sort-box { box-shadow: 0 4px 12px rgba(30, 41, 59, .04); }
        .product-item { animation: muncul .25s ease both; }
        .product-name { overflow-wrap: anywhere; }
        .no-result { background: rgba(255, 255, 255, .7); }
        @keyframes muncul {
            from { opacity: 0; transform: translateY(7px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

    <h2>Dapur Cikarag 1</h2>
    
    <!-- Form Tambah / Edit Barang -->
    <div class="card">
        <h3 id="formTitle">+ Tambah Barang Baru</h3>
        <form id="productForm" class="form-group">
            <!-- Input tersembunyi untuk menyimpan index saat mode edit -->
            <input type="hidden" id="editIndex" value="">
            <input type="text" id="newPriceName" placeholder="Nama barang..." required>
            <input type="number" id="newPriceValue" placeholder="Harga (Angka saja)..." required>
            <button type="submit" id="submitBtn">Simpan</button>
        </form>
    </div>

    <!-- Kontrol Pencarian & Pengurutan -->
    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="Ketik nama barang yang dicari...">
        
        <select id="sortInput" class="sort-box">
            <option value="default">Urutan: Default</option>
            <option value="cheap">Harga: Murah ke Mahal</option>
            <option value="expensive">Harga: Mahal ke Murah</option>
        </select>
    </div>

    <!-- Tempat Menampilkan Hasil -->
    <ul id="productList" class="product-list"></ul>

    <script>
        // Data awal bawaan
        const barangDefault = [
            { nama: "Laptop Asus ROG", harga: 15000000 },
            { nama: "Smartphone Samsung Galaxy", harga: 5500000 },
            { nama: "Headphone Sony WH-1000XM4", harga: 3800000 },
            { nama: "Mouse Logitech G Pro", harga: 1200000 }
        ];

        // Mengambil data dari LocalStorage
        let dataBarang = JSON.parse(localStorage.getItem('dataBarang')) || barangDefault;

        const productForm = document.getElementById('productForm');
        const searchInput = document.getElementById('searchInput');
        const sortInput = document.getElementById('sortInput');
        const productList = document.getElementById('productList');
        const editIndexInput = document.getElementById('editIndex');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');

        // Format angka ke mata uang Rupiah
        function formatRupiah(angka) {
            return "Rp " + angka.toLocaleString('id-ID');
        }

        // Fungsi Utama: Mengolah Filter, Sort, dan Menampilkan Data
        function prosesDanTampilkanData() {
            const kataKunci = searchInput.value.toLowerCase();
            const tipeSort = sortInput.value;

            // Tambahkan index asli ke tiap barang agar posisi data tidak tertukar saat difilter/disort
            let hasil = dataBarang.map((barang, index) => ({ ...barang, indexAsli: index }));

            // 1. Proses Filter Pencarian
            hasil = hasil.filter(barang => {
                return barang.nama.toLowerCase().includes(kataKunci);
            });

            // 2. Proses Pengurutan (Sorting)
            if (tipeSort === 'cheap') {
                hasil.sort((a, b) => a.harga - b.harga); 
            } else if (tipeSort === 'expensive') {
                hasil.sort((a, b) => b.harga - a.harga); 
            }

            // 3. Tampilkan ke HTML
            productList.innerHTML = ""; 

            if (hasil.length === 0) {
                productList.innerHTML = `<li class="no-result">Barang tidak ditemukan</li>`;
                return;
            }

            hasil.forEach(barang => {
                const li = document.createElement('li');
                li.className = 'product-item';
                li.innerHTML = `
                    <div class="product-info">
                        <span class="product-name">${barang.nama}</span>
                        <span class="product-price">${formatRupiah(barang.harga)}</span>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-edit" onclick="aktifkanModeEdit(${barang.indexAsli})">Edit</button>
                        <button class="btn-delete" onclick="hapusBarang(${barang.indexAsli})">Hapus</button>
                    </div>
                `;
                productList.appendChild(li);
            });
        }

        // Fungsi FITUR 1: Aksi Hapus Barang
        function hapusBarang(index) {
            if (confirm("Apakah Anda yakin ingin menghapus barang ini?")) {
                dataBarang.splice(index, 1); // Hapus 1 data pada index terpilih
                simpanKeLocalStorage();
                prosesDanTampilkanData();
                resetForm(); // Reset jika sedang mengedit data yang dihapus
            }
        }

        // Fungsi FITUR 2: Masuk ke Mode Edit Barang
        function aktifkanModeEdit(index) {
            const barang = dataBarang[index];
            
            // Masukkan data barang yang dipilih ke kolom input form
            editIndexInput.value = index;
            document.getElementById('newPriceName').value = barang.nama;
            document.getElementById('newPriceValue').value = barang.harga;
            
            // Ubah tampilan teks judul form dan tombol
            formTitle.innerText = "✍️ Edit Barang";
            submitBtn.innerText = "Perbarui";
            submitBtn.style.backgroundColor = "#e67e22";
            
            // Scroll otomatis ke area form agar nyaman di perangkat mobile
            productForm.scrollIntoView({ behavior: 'smooth' });
        }

        // Fungsi untuk mengembalikan form ke kondisi tambah baru
        function resetForm() {
            productForm.reset();
            editIndexInput.value = "";
            formTitle.innerText = "+ Tambah Barang Baru";
            submitBtn.innerText = "Simpan";
            submitBtn.style.backgroundColor = "#3498db";
        }

        // Fungsi menyimpan struktur array ke LocalStorage browser
        function simpanKeLocalStorage() {
            localStorage.setItem('dataBarang', JSON.stringify(dataBarang));
        }

        // Event listener ketik & ganti pengurutan
        searchInput.addEventListener('input', prosesDanTampilkanData);
        sortInput.addEventListener('change', prosesDanTampilkanData);

        // Event listener saat Form di-submit (Bisa Tambah Baru atau Update Edit)
        productForm.addEventListener('submit', function(e) {
            e.preventDefault(); 

            const nama = document.getElementById('newPriceName').value;
            const harga = parseInt(document.getElementById('newPriceValue').value);
            const indexEdit = editIndexInput.value;

            if (indexEdit === "") {
                // Mode Tambah Barang Baru
                dataBarang.push({ nama: nama, harga: harga });
            } else {
                // Mode Update / Edit Barang Lama
                dataBarang[indexEdit] = { nama: nama, harga: harga };
            }

            simpanKeLocalStorage();
            prosesDanTampilkanData();
            resetForm();
        });
        
        // Tampilkan data saat halaman pertama kali dibuka.
        prosesDanTampilkanData();
    </script>
</body>
</html>
